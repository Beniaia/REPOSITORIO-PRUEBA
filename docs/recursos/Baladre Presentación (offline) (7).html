document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:var(--oleander-soft)\" aria-hidden=\"true\">\n      <path d=\"M150 20 C120 55 110 95 96 150\" stroke=\"currentColor\" stroke-width=\"1.1\" fill=\"none\" opacity=\".8\"><\u002Fpath>\n      <path d=\"M138 60 C150 64 162 60 170 50\" stroke=\"currentColor\" stroke-width=\"1\" fill=\"none\"><\u002Fpath>\n      <path d=\"M118 105 C132 110 146 106 154 95\" stroke=\"currentColor\" stroke-width=\"1\" fill=\"none\"><\u002Fpath>\n      <path d=\"M125 80 C112 72 100 74 92 84\" stroke=\"currentColor\" stroke-width=\"1\" fill=\"none\"><\u002Fpath>\n      <use href=\"#bloom\" x=\"138\" y=\"18\" width=\"44\" height=\"44\"><\u002Fuse>\n      <use href=\"#bloom\" x=\"108\" y=\"58\" width=\"40\" height=\"40\"><\u002Fuse>\n      <use href=\"#bloom\" x=\"128\" y=\"100\" width=\"34\" height=\"34\"><\u002Fuse>\n      <use href=\"#bloom\" x=\"74\" y=\"128\" width=\"38\" height=\"38\"><\u002Fuse>\n    <\u002Fsvg>\n    <div class=\"slide-inner cover\">\n      <div class=\"cover-top reveal r1\">\n        <span class=\"brandmark\">Baladre Cerámica<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cover-title\">\n        <div class=\"cover-kicker reveal r2\">Plan estratégico de crecimiento comercial<\u002Fdiv>\n        <h1 class=\"display reveal r3\">No fabricamos piezas.<br><em class=\"soft\">Creamos identidad.<\u002Fem><\u002Fh1>\n        <p class=\"cover-sub reveal r5\">De taller artesanal a estudio creativo de piezas cerámicas exclusivas para marcas, espacios y experiencias.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"cover-bottom reveal r6\">\n        <span>Horizonte 2026 — 2028<\u002Fspan>\n        <span>→ usa las flechas para avanzar<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-hud=\"light\" data-title=\"La idea\" data-screen-label=\"02\">\n    <svg class=\"rings-wm\" style=\"color:var(--clay)\" aria-hidden=\"true\"><use href=\"#rings\"><\u002Fuse><\u002Fsvg>\n    <div class=\"slide-inner\">\n      <div class=\"eyebrow reveal r1\">01 · La idea principal<\u002Fdiv>\n      <h2 class=\"display reveal r2\">Baladre no crece<br>vendiendo más piezas.<br>Crece construyendo<br><em class=\"soft\">relaciones recurrentes.<\u002Fem><\u002Fh2>\n      <p class=\"lede muted reveal r4\" style=\"margin-top:1.6rem\">La oportunidad no está en fabricar más. Está en ocupar una posición única en el mercado.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-hud=\"light\" data-title=\"El cambio de posicionamiento\" data-screen-label=\"03\">\n    <div class=\"slide-inner\">\n      <div class=\"eyebrow reveal r1\">02 · El cambio de posicionamiento<\u002Fdiv>\n      <div class=\"panels\">\n        <div class=\"panel panel--before reveal r2\">\n          <div class=\"tag\">Antes<\u002Fdiv>\n          <div class=\"big\">Taller artesanal de cerámica.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"panel panel--after reveal r4\">\n          <div class=\"tag\">Después<\u002Fdiv>\n          <div class=\"big\">Estudio creativo de piezas cerámicas exclusivas para marcas, espacios y experiencias.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"arrow-between reveal r3\" aria-hidden=\"true\">→<\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"reveal r5\" style=\"margin-top:1.6rem; font-family:var(--ff-display); font-style:italic; font-size:clamp(1.15rem,2.1vw,1.6rem); color:var(--clay)\">Dejamos de vender cerámica artesanal para vender la capacidad de transformar una idea en una pieza única.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-hud=\"light\" data-title=\"Aprendizajes del mercado\" data-screen-label=\"04b\">\n    <div class=\"slide-inner\">\n      <div class=\"eyebrow reveal r1\">Lo que hacen los mejores del sector<\u002Fdiv>\n      <h2 class=\"h-l reveal r2\" style=\"max-width:24ch; margin-bottom:1.6rem\">Los referentes no venden cerámica.<br>Venden <em class=\"soft\">lo que la cerámica consigue.<\u002Fem><\u002Fh2>\n      <div class=\"grid-4\">\n        <div class=\"card reveal r3\"><div class=\"num\">01<\u002Fdiv><h3>Especializan el discurso<\u002Fh3><p>Hacen de todo, pero una sola idea lo une todo.<\u002Fp><\u002Fdiv>\n        <div class=\"card reveal r4\"><div class=\"num\">02<\u002Fdiv><h3>Enseñan proyectos<\u002Fh3><p>Un caso de estudio convence más que una foto suelta.<\u002Fp><\u002Fdiv>\n        <div class=\"card reveal r5\"><div class=\"num\">03<\u002Fdiv><h3>Tienen un código propio<\u002Fh3><p>Una textura, un esmalte, una mirada reconocible.<\u002Fp><\u002Fdiv>\n        <div class=\"card reveal r6\"><div class=\"num\">04<\u002Fdiv><h3>Convierten los años en autoridad<\u002Fh3><p>La experiencia pesa cuando se cuenta.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"reveal r7\" style=\"margin-top:1.7rem; font-family:var(--ff-display); font-style:italic; font-size:clamp(1.2rem,2.3vw,1.7rem); color:var(--clay)\">Baladre ya tiene la obra. Solo le falta contarla así.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-hud=\"light\" data-title=\"Qué debe cambiar\" data-screen-label=\"05\">\n    <div class=\"slide-inner\">\n      <div class=\"eyebrow reveal r1\">04 · Qué debe cambiar<\u002Fdiv>\n      <h2 class=\"h-l reveal r2\" style=\"max-width:22ch\">El nuevo posicionamiento debe notarse en <em class=\"soft\">cada punto de contacto.<\u002Fem><\u002Fh2>\n      <p class=\"lede muted reveal r3\" style=\"margin-top:1.1rem\">No basta con cambiar el discurso. Hay que aplicarlo en todo lo que el cliente ve:<\u002Fp>\n      <ul class=\"changelist reveal r4\">\n        <li>Web<\u002Fli><li>Presentaciones<\u002Fli><li>LinkedIn<\u002Fli>\n        <li>Reuniones<\u002Fli><li>Propuestas comerciales<\u002Fli><li>Cómo se explica el trabajo<\u002Fli>\n      <\u002Ful>\n      <p class=\"reveal r5\" style=\"margin-top:1.6rem; font-family:var(--ff-mono); font-size:.84rem; letter-spacing:.14em; color:var(--clay)\">DE PROVEEDOR&nbsp;&nbsp;→&nbsp;&nbsp;A SOCIO CREATIVO<\u002Fp>\n    <\ =\"Arrastra una foto de las dos ceramistas o del taller\"><\u002Fimage-slot>\n        <div>\n          <h2 class=\"h-l reveal r3\" style=\"margin-bottom:1.2rem\">Dos ceramistas.<br>Treinta años.<br><em class=\"soft\">Cada pieza pasa por sus manos.<\u002Fem><\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:.9rem;margin-bottom:1.4rem\">\n            <div class=\"reveal r4\" style=\"border-top:1px solid color-mix(in srgb,var(--espresso) 16%,transparent);padding-top:.7rem\"><strong style=\"font-family:var(--ff-display);font-size:1.15rem\">Atención directa<\u002Fstrong><span style=\"display:block;font-size:.92rem;opacity:.7\">Hablas con quien diseña y cuece la pieza.<\u002Fspan><\u002Fdiv>\n            <div class=\"reveal r5\" style=\"border-top:1px solid color-mix(in srgb,var(--espresso) 16%,transparent);padding-top:.7rem\"><strong style=\"font-family:var(--ff-display);font-size:1.15rem\">Autoría real<\u002Fstrong><span style=\"display:block;font-size:.92rem;opacity:.7\">Sin cadena de montaje ni intermediarios.<\u002Fspan><\u002Fdiv>\n            <div class=\"reveal r6\" style=\"border-top:1px solid color-mix(in srgb,var(--espresso) 16%,transparent);padding-top:.7rem\"><strong style=\"font-family:var(--ff-display);font-size:1.15rem\">Control creativo total<\u002Fstrong><span style=\"display:block;font-size:.92rem;opacity:.7\">Cada decisión es deliberada, no estándar.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <p class=\"reveal r7\" style=\"font-family:var(--ff-display);font-style:italic;font-size:clamp(1.1rem,2vw,1.5rem);color:var(--clay)\">Ser pequeño no es la limitación. Es la razón por la que cada proyecto es irrepetible.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-hud=\"light\" data-title=\"Qué decide la compra\" data-screen-label=\"07\">\n    <div class=\"slide-inner\">\n      <div class=\"eyebrow reveal r1\">06 · Qué decide la compra<\u002Fdiv>\n      <h2 class=\"h-m reveal r2\" style=\"max-width:24ch\">Empezamos hablando de lo que el cliente <em class=\"soft\">no decide primero.<\u002Fem><\u002Fh2>\n      <div class=\"chips reveal r3\" style=\"margin-top:1rem; margin-bottom:1.1rem\">\n        <span class=\"chip\">Materiales<\u002Fspan><span class=\"chip\">Técnicas<\u002Fspan><span class=\"chip\">Procesos<\u002Fspan><span class=\"chip\">Tiempos<\u002Fspan><span class=\"chip\">Precio<\u002Fspan>\n      <\u002Fdiv>\n      <p class=\"reveal r4\" style=\"font-family:var(--ff-mono);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--clay);margin-bottom:.3rem\">Lo que de verdad compra cada cliente<\u002Fp>\n      <div class=\"maplist maplist--tight\">\n        <div class=\"maprow reveal r5\"><span class=\"who\">Arquitecto<\u002Fspan><span class=\"line\"><\u002Fspan><span class=\"what\">Diferenciación<\u002Fspan><\u002Fdiv>\n        <div class=\"maprow reveal r5\"><span class=\"who\">Hotel<\u002Fspan><span class=\"line\"><\u002Fspan><span class=\"what\">Experiencia<\u002Fspan><\u002Fdiv>\n        <div class=\"maprow reveal r6\"><span class=\"who\">Agencia<\u002Fspan><span class=\"line\"><\u002Fspan><span class=\"what\">Impacto<\u002Fspan><\u002Fdiv>\n        <div class=\"maprow reveal r6\"><span class=\"who\">Restaurante<\u002Fspan><span class=\"line\"><\u002Fspan><span class=\"what\">Identidad<\u002Fspan><\u002Fdiv>\n        <div class=\"maprow reveal r7\"><span class=\"who\">Marca<\u002Fspan><span class=\"line\"><\u002Fspan><span class=\"what\">Recuerdo<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide slide--clay\" data-hud=\"dark\" data-title=\"Propuesta de valor\" data-screen-label=\"09\">\n    <svg class=\"rings-wm\" style=\"color:var(--bone)\" aria-hidden=\"true\"><use href=\"#rings\"><\u002Fuse><\u002Fsvg>\n    <div class=\"slide-inner\">\n      <div class=\"eyebrow reveal r1\">08 · Nueva propuesta de valor<\u002Fdiv>\n      <h2 class Array.from(segbar.children);\n\n    const ovGrid = document.getElementById('ovGrid');\n    slides.forEach((s, idx)=>{\n      const b = document.createElement('button');\n      b.className = 'ov-item';\n      b.innerHTML = '<span class=\"ov-n\">'+String(idx+1).padStart(2,'0')+'<\u002Fspan><span class=\"ov-t\">'+(s.dataset.title||'')+'<\u002Fspan>';\n      b.addEventListener('click', ()=>{ go(idx); closeOverview(); });\n      ovGrid.appendChild(b);\n    });\n    const ovItems = Array.from(ovGrid.children);\n\n    function update(){\n      slides.forEach((s,idx)=>s.classList.toggle('is-active', idx===i));\n      elCur.textContent = String(i+1).padStart(2,'0');\n      elTtl.textContent = slides[i].dataset.title || '';\n      const dark = slides[i].dataset.hud === 'dark';\n      body.classList.toggle('is-dark-hud', dark);\n      body.classList.toggle('is-light-hud', !dark);\n      body.classList.toggle('on-cover', slides[i].classList.contains('cover'));\n      const prog = (i+1)/total;\n      wheelFill.style.strokeDashoffset = C*(1-prog);\n      segs.forEach((seg,idx)=>{\n        seg.classList.toggle('done', idx < i);\n        seg.classList.toggle('current', idx === i);\n      });\n      ovItems.forEach((it,idx)=>it.classList.toggle('current', idx===i));\n      btnPrev.disabled = i===0;\n      btnNext.disabled = i===total-1;\n    }\n\n    function go(n){ i = Math.max(0, Math.min(total-1, n)); update(); dismissHint(); }\n    function next(){ go(i+1); }\n    function prev(){ go(i-1); }\n\n    let hintTimer = setTimeout(dismissHint, 5000);\n    function dismissHint(){ hint.classList.add('gone'); clearTimeout(hintTimer); }\n\n    const overview = document.getElementById('overview');\n    function openOverview(){ overview.classList.add('open'); }\n    function closeOverview(){ overview.classList.remove('open'); }\n    document.getElementById('btnOverview').addEventListener('click', openOverview);\n    document.getElementById('ovClose').addEventListener('click', closeOverview) ioridad 3\",\n        encaje:\"Agencia global de <b>eventos y engagement marketing<\u002Fb>. Oficinas en Madrid y Barcelona. (Ojo: no confundir con “Grupo MCI” de Gavà, que es otra empresa.)\",\n        rows:[[\"Área\",\"MCI Spain — eventos / experiencias\"],[\"Barcelona\",\"C/ Tuset 32, 08006 Barcelona (+ oficina Madrid)\"],[\"Teléfono\",\"+34 93 445 97 20\"],[\"Web\",'<a href=\"https://www.wearemci.com/es\" target=\"_blank\" rel=\"noopener\">wearemci.com<\u002Fa> · mcispain.es']],\n        conf:\"Confianza alta. Verificar que escribes a MCI Spain (wearemci.com), no a grupo-mci.com.\",\n        subj:\"vuestros eventos corporativos y experiencias\", gancho:\"producís eventos corporativos y experiencias para grandes clientes\" },\n      eventoplus:{ name:\"Eventoplus\", prio:\"Prioridad 3 · plataforma\",\n        encaje:\"No es cliente final, sino la <b>plataforma del sector MICE<\u002Fb>: directorio de proveedores (60.000+ visitas/mes) y los <b>Premios Eventoplus<\u002Fb>. La vía para que las agencias de eventos os encuentren.\",\n        rows:[[\"Área\",\"Grupo eventoplus — alta en directorio / Premios\"],[\"Barcelona\",\"C/ Diputació 256, 5º1ª, 08007 · +34 93 272 09 27\"],[\"Madrid\",\"C/ Oruro 9, 28016 · +34 91 022 86 86\"],[\"Email\",\"info@eventoplus.com\"],[\"Contacto\",'<a href=\"https://www.eventoplus.com/directorio/\" target=\"_blank\" rel=\"noopener\">eventoplus.com/directorio<\u002Fa>']],\n        conf:\"Confianza alta. Aquí el objetivo es daros de alta como proveedor, no vender una pieza.\",\n        subj:\"dar de alta a Baladre en vuestro directorio de proveedores\", gancho:\"sois el punto de encuentro de las agencias de eventos en España\" }\n    };\n\n    function mailFor(c){\n      return `Asunto: Piezas cerámicas exclusivas para ${c.subj}\n\nHola [nombre],\n\nSoy [tu nombre], de Baladre Cerámica, estudio creativo de cerámica artesanal en Alicante (más de 30 años de oficio).\n\nNo hacemos cerámica de catálogo: convertimos la identidad de una marca o un proyecto en piezas únicas —trofeos, regalos premium, piezas para eventos y experiencias— imposibles de encontrar en otro sitio.\n\nOs escribo porque en ${c.name} ${c.gancho}, y creo que encajaríamos muy bien. ¿Tendríais 15 minutos esta semana o la próxima para que os enseñe algún proyecto similar?\n\nUn saludo,\n[tu nombre] · Baladre Cerámica\nbaladreceramica.com · [teléfono]`;\n    }\n\n    const fName=document.getElementById('fName'), fPrio=document.getElementById('fPrio'),\n          fEncaje=document.getElementById('fEncaje'), fRows=document.getElementById('fRows'),\n          fConf=document.getElementById('fConf'), fMail=document.getElementById('fMail'),\n          fCopy=document.getElementById('fCopy');\n\n    function openFicha(key){\n      const c = COMPANIES[key]; if(!c) return;\n      fName.textContent = c.name;\n      fPrio.textContent = c.prio;\n      fEncaje.innerHTML = c.encaje;\n      fRows.innerHTML = c.rows.map(r=>`<div class=\"frow\"><span class=\"fk\">${r[0]}<\u002Fspan><span>${r[1]}<\u002Fspan><\u002Fdiv>`).join('');\n      fConf.textContent = c.conf;\n      fMail.value = mailFor(c);\n      fCopy.textContent = 'Copiar'; fCopy.classList.remove('done');\n      ficha.classList.add('open');\n    }\n    function closeFicha(){ ficha.classList.remove('open'); }\n\n    document.querySelectorAll('.co-btn').forEach(btn=>{\n      btn.addEventListener('click', ()=>openFicha(btn.dataset.co));\n    });\n    document.getElementById('fClose').addEventListener('click', closeFicha);\n    ficha.addEventListener('click', (e)=>{ if(e.target===ficha) closeFicha(); });\n\n    fCopy.addEventListener('click', async ()=>{\n      try{ await navigator.clipboard.writeText(fMail.value); }\n      catch(_){ fMail.select(); try{ document.execCommand('copy'); }catch(__){} }\n      fCopy.textContent='¡Copiado!'; fCopy.classList.add('done');\n      setTimeout(()=>{ fCopy.textContent='Copiar'; fCopy.classList.remove('done'); }, 1800);\n    });\n\n    // ===== visor de entregables (munición comercial, slide 19) =====\n    const vframe = document.getElementById('viewerFrame');\n    const vtitle = document.getElementById('viewerTitle');\n    const DL_SRC = {\n      web:'entregables/baladre-web.html',\n      dossier:'entregables/baladre-dossier.html',\n      agencias:'entregables/baladre-agencias.html',\n      arquitectos:'entregables/baladre-arquitectos.html',\n      discurso:'entregables/baladre-discurso-comercial.html'\n    };\n    const DL_TITLES = {\n      web:'Web · propuesta de home',\n      dossier:'Dossier profesional',\n      agencias:'Presentación para agencias',\n      arquitectos:'Presentación para arquitectos',\n      discurso:'Discurso comercial'\n    };\n    function openDL(key){\n      const src = DL_SRC[key]; if(!src) return;\n      vtitle.textContent = DL_TITLES[key] || 'Entregable';\n      vframe.src = src;\n      viewer.classList.add('open');\n    }\n    function closeDL(){ viewer.classList.remove('open'); vframe.src = 'about:blank'; }\n    document.querySelectorAll('.dl-btn').forEach(b=>{\n      b.addEventListener('click', e=>{ e.stopPropagation(); openDL(b.dataset.dl); });\n    });\n    document.getElementById('viewerClose').addEventListener('click', closeDL);\n    viewer.addEventListener('click', e=>{ if(e.target===viewer) closeDL(); });\n\n    update();\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
